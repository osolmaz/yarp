rust:
  coverage:
    threshold: 85
  complexity:
    cognitive_max: 8
  targets:
    - .
  dry:
    max_findings: 0
    paths:
      - .
    copied_blocks:
      enabled: true
      min_tokens: 100
  unsafe:
    policy: forbid
  mutation:
    targets:
      - src
      - toolcall-extractor/src
  dependency_boundaries:
    - from: .
      allow: []
    - from: toolcall-extractor
      allow:
        - .

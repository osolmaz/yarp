[package]
name = "yarp-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Prune Pi command output and archive tool calls locally"
publish = false

[[bin]]
name = "yarp"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting"] }
zstd = "0.13"

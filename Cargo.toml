[workspace]
members = [".", "rule-pack", "toolcall-extractor"]
resolver = "3"

[package]
name = "yarp-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Prune Pi command output and archive tool calls locally"
publish = false
build = "build.rs"

[[bin]]
name = "yarp"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[dependencies]
rusqlite = { version = "=0.39.0", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting"] }
yarp-rule-pack = { path = "rule-pack" }
zstd = "0.13"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
yarp-rule-pack = { path = "rule-pack" }

[workspace]
members = [".", "rule-pack", "toolcall-extractor"]
resolver = "3"

[package]
name = "yarp-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Prune Pi command output and archive tool calls locally"
license = "MIT"
repository = "https://github.com/osolmaz/yarp"
publish = ["crates-io"]
build = "build.rs"

[[bin]]
name = "yarp"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[dependencies]
fs2 = "0.4"
regex = { version = "=1.13.1", default-features = false, features = ["std"] }
rusqlite = { version = "=0.39.0", features = ["backup", "bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.11"
skillflag = "=0.1.0"
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting"] }
toml_edit = { version = "=0.25.13", features = ["serde"] }
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"
yarp-rule-pack = { version = "=0.1.0", path = "rule-pack" }
zstd = "0.13"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
yarp-rule-pack = { version = "=0.1.0", path = "rule-pack" }

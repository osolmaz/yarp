[package]
name = "yarp-rule-pack"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Validate and compile declarative YARP rule packs"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
